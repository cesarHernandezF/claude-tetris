<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; }
    catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false"></button>
  <main class="app">
  <h1 class="game-title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>T</kbd> tema</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-extra" class="hidden">
          <form id="name-entry" class="name-entry hidden">
            <label for="name-input" class="label">NUEVO RECORD - TU NOMBRE</label>
            <div class="name-row">
              <input id="name-input" type="text" maxlength="12" autocomplete="off" placeholder="Jugador" />
              <button id="save-score-btn" type="submit">Guardar</button>
            </div>
          </form>
          <div id="overlay-scores" class="scores"></div>
          <div id="overlay-stats" class="stats"></div>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div id="start-scores" class="scores"></div>
        <div id="start-stats" class="stats"></div>
        <button id="start-btn" type="button">Jugar</button>
        <button id="reset-scores-btn" class="link-btn" type="button">Resetear records</button>
      </div>
    </div>
  </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
